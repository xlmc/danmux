<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DanmuX v1 调试台</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1020;
    color: #edf2ff;
  }

  * { box-sizing: border-box; }
  body { margin: 0; min-width: 320px; background: radial-gradient(circle at 80% 0%, #28366b 0, #0b1020 42rem); }
  main { width: min(1280px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
  header { margin-bottom: 24px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.7rem); letter-spacing: -0.03em; }
  h2 { font-size: 1rem; margin-bottom: 12px; }
  .subtitle { color: #aab6d8; margin-top: 8px; line-height: 1.6; }
  .layout { display: grid; grid-template-columns: minmax(280px, 0.85fr) minmax(340px, 1.15fr); gap: 16px; align-items: start; }
  .panel { border: 1px solid #2b3964; background: rgba(15, 23, 48, 0.9); border-radius: 16px; padding: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22); }
  .stack { display: grid; gap: 14px; }
  label { display: grid; gap: 7px; color: #b6c2e2; font-size: 0.86rem; }
  textarea, input, button { font: inherit; }
  textarea, input { width: 100%; border: 1px solid #3a4c7c; border-radius: 9px; background: #080d1c; color: #edf2ff; padding: 10px 11px; outline: none; }
  textarea:focus, input:focus { border-color: #7da2ff; box-shadow: 0 0 0 3px rgba(125, 162, 255, 0.18); }
  textarea { min-height: 180px; resize: vertical; line-height: 1.45; font-family: "Cascadia Code", Consolas, monospace; font-size: 0.82rem; }
  #stopsInput { min-height: 130px; }
  .controls { display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
  button { border: 0; border-radius: 9px; background: #7da2ff; color: #091128; padding: 11px 14px; font-weight: 700; cursor: pointer; }
  button:hover { background: #a9c0ff; }
  .status { min-height: 24px; color: #86efac; font-size: 0.86rem; }
  .status.error { color: #fda4af; }
  .stage { min-height: 250px; display: grid; place-items: center; overflow: hidden; border-radius: 12px; border: 1px solid #2b3964; background: linear-gradient(135deg, #111a36, #050812); position: relative; }
  .stage::before, .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 28px 28px; mask-image: linear-gradient(to bottom, transparent, #000, transparent); }
  .stage-caption { position: absolute; top: 14px; left: 16px; color: #8290b5; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
  #danmakuText { position: relative; z-index: 1; max-width: 92%; overflow-wrap: anywhere; text-align: center; font-size: clamp(1.7rem, 5vw, 3.4rem); font-weight: 700; line-height: 1.2; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: #aab6d8; font-size: 0.82rem; margin-top: 12px; }
  .meta span { white-space: nowrap; }
  .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .output { min-width: 0; }
  pre { margin: 0; max-height: 310px; overflow: auto; border: 1px solid #2b3964; border-radius: 9px; background: #080d1c; padding: 12px; color: #dbe5ff; font: 0.78rem/1.5 "Cascadia Code", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .hint { color: #8e9abd; font-size: 0.78rem; line-height: 1.5; }
  @media (max-width: 800px) {
    main { width: min(100% - 20px, 680px); padding-top: 22px; }
    .layout, .output-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<main>
  <header>
    <h1>DanmuX v1 调试台</h1>
    <p class="subtitle">输入真实 Bilibili 字段，调整明确的渐变规则，观察渲染、标准模型、兼容线格式和诊断是否一致。</p>
  </header>

  <div class="layout">
    <section class="panel stack" aria-labelledby="inputTitle">
      <div>
        <h2 id="inputTitle">输入与规则</h2>
        <p class="hint">原始 JSON 会经过当前仓库的 fromBilibili()；渐变 stops 不使用内置预设。</p>
      </div>
      <label>原始 Bilibili JSON
        <textarea id="rawInput" spellcheck="false">{
  "id": 123456,
  "idStr": "123456",
  "progress": 12500,
  "mode": 1,
  "fontsize": 32,
  "color": 16777215,
  "content": "可调试渐变弹幕"
}</textarea>
      </label>
      <div class="controls">
        <label>角度（度）
          <input id="angleInput" type="number" value="0" step="1" min="-360" max="360">
        </label>
        <label>渐变 stops（JSON）
          <textarea id="stopsInput" spellcheck="false">[
  { "position": 0, "color": "#FB7299", "alpha": 0.85 },
  { "position": 1, "color": "#33B8FF", "alpha": 0.85 }
]</textarea>
        </label>
      </div>
      <button id="renderButton" type="button">转换并刷新结果</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="previewTitle">
      <h2 id="previewTitle">直观预览</h2>
      <div class="stage" role="img" aria-label="弹幕渐变预览">
        <span class="stage-caption">fill gradient preview</span>
        <div id="danmakuText">等待转换</div>
      </div>
      <div class="meta" id="meta" aria-live="polite"></div>
    </section>
  </div>

  <section class="panel output-grid" aria-label="转换输出">
    <div class="output">
      <h2>DanmuX 标准模型</h2>
      <pre id="modelOutput">等待转换</pre>
    </div>
    <div class="output">
      <h2>兼容 p / m 与诊断</h2>
      <pre id="wireOutput">等待转换</pre>
    </div>
  </section>
</main>

<script src="/demo/client.js" defer></script>
</body>
</html>
